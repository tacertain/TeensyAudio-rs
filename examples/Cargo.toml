[package]
name = "teensy-audio-examples"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Hardware examples for teensy-audio on Teensy 4.1 + Audio Shield"
autoexamples = false

[dependencies]
teensy-audio = { path = "../teensy-audio", features = ["dsp", "sgtl5000"] }
teensy4-bsp = { version = "0.6", features = ["rt"] }
teensy4-panic = { version = "0.3", features = ["log"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
rtic = { version = "2", features = ["thumbv7-backend"] }
embedded-hal = "1.0"
imxrt-ral = { version = "0.6", features = ["imxrt1062"] }
# USB serial logging, for the examples that report what they measure.
imxrt-log = { version = "0.2", default-features = false, features = ["log", "usbd"] }
log = "0.4"
rtic-monotonics = { version = "1", default-features = false, features = ["cortex-m-systick"] }
libm = "0.2"
[[bin]]
name = "sine_tone"
path = "src/sine_tone.rs"
required-features = []

[[bin]]
name = "line_in_passthrough"
path = "src/line_in_passthrough.rs"
required-features = []

[[bin]]
name = "graph_synth"
path = "src/graph_synth.rs"
required-features = []

[[bin]]
name = "uda1334a_sine"
path = "src/uda1334a_sine.rs"
required-features = []
