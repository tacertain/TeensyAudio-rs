[package]
name = "teensy-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Audio processing framework for Teensy 4.x in Rust"
repository = "https://github.com/tacertain/TeensyAudio-rs"
readme = "../README.md"
keywords = ["teensy", "audio", "dsp", "embedded", "no-std"]
categories = ["embedded", "no-std", "multimedia::audio"]
[features]
default = ["dsp", "sgtl5000"]
sgtl5000 = ["dep:embedded-hal"]
i2s = []
dma = []
dsp = []

[dependencies]
embedded-hal = { version = "1.0", optional = true }
libm = "0.2"

[dev-dependencies]
